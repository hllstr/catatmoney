[package]
name = "catatmoney"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-sys = { version = "0.3", features = ["Storage", "Window", "Crypto", "HtmlInputElement", "HtmlElement", "Url", "File", "FileList", "Element", "Document", "DomTokenList", "FileReader", "Blob"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
